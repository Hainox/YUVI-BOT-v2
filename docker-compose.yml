name: yuvibotv2

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: yuvi
      POSTGRES_USER: yuvi
      POSTGRES_PASSWORD: yuvi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuvi -d yuvi"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dedicated test-only data stores. They use a separate volume/network DNS
  # name so the test profile can never write to the production Postgres/Redis.
  postgres-test:
    profiles: ["test"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: yuvi_test
      POSTGRES_USER: yuvi
      POSTGRES_PASSWORD: yuvi
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuvi -d yuvi_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-test:
    profiles: ["test"]
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: bot.Dockerfile
    env_file:
      - .env
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  migrations-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: bot.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://yuvi:yuvi@postgres-test:5432/yuvi_test
      REDIS_URL: redis://redis-test:6379/0
    command: alembic upgrade head
    depends_on:
      postgres-test:
        condition: service_healthy

  # Self-hosted media-download backend (MEDIA-01/02, DEPLOY-01) — внутренний
  # сервис без внешних портов, как nlp/redis; бот обращается по внутреннему
  # COBALT_API_URL=http://cobalt:9000/ (docker DNS-имя сервиса).
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      # API_URL обязателен даже для внутреннего инстанса — без него
      # tunnel/redirect-ссылки в ответах cobalt нерабочие (06-RESEARCH.md
      # Pitfall 5).
      API_URL: "http://cobalt:9000/"
    # Портов наружу НЕ открываем — только bot обращается к cobalt внутри
    # сети compose, как nlp:8000.

  bot:
    build:
      context: .
      dockerfile: bot.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # Личная MTProto-сессия для /backfill (Kurigram) — .dockerignore нарочно
    # исключает *.session из образа (не коммитим секреты в слои), поэтому
    # уже авторизованный файл сессии с хоста монтируется отдельно. Без этого
    # каждый пересозданный контейнер требовал бы новый интерактивный ввод
    # кода подтверждения, который некому принять в отсоединённом контейнере
    # (EOFError — см. docs/backfill-setup.md).
    volumes:
      - ./yuvi_backfill_session.session:/app/yuvi_backfill_session.session
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      cobalt:
        condition: service_started

  # Полный тестовый набор в изолированном окружении. По умолчанию сервис
  # не запускается; используйте `docker compose --profile test run --rm --build test`.
  # Образ содержит runtime, API и dev-зависимости, поэтому pytest не требуется
  # устанавливать на хостовой машине.
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://yuvi:yuvi@postgres-test:5432/yuvi_test
      REDIS_URL: redis://redis-test:6379/0
      # Разрешает tests/conftest.py использовать только выделенный test-Postgres,
      # а не production DATABASE_URL из .env.
      YUVI_TEST_ISOLATED: "1"
    volumes:
      - .:/app
    depends_on:
      migrations-test:
        condition: service_completed_successfully
      redis-test:
        condition: service_healthy
      postgres-test:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nlp:
    build:
      context: .
      dockerfile: nlp/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"

  miniapp:
    build:
      context: .
      dockerfile: miniapp/Dockerfile
    restart: unless-stopped
    ports:
      - "8003:80"

  # HTTPS edge for the Mini App (DEPLOY-05, D-01/D-02). Only activated when
  # the user sets COMPOSE_PROFILES=https in .env — absent from a default
  # `docker compose up`, so local/dev stays byte-for-byte plain HTTP on
  # miniapp:8003 (unchanged above). When active, terminates TLS in front of
  # the existing miniapp/api containers (neither is modified). Wrapper script
  # (nginx/docker-entrypoint-wrapper.sh) is a no-op (sleep infinity) whenever
  # DOMAIN is empty, so even an explicit `--profile https up` without a real
  # domain configured cannot crash-loop or bind ports incorrectly.
  nginx-https:
    image: jonasal/nginx-certbot:6.2.0-nginx1.31.2
    restart: unless-stopped
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      # Let's Encrypt STAGING environment has much higher rate limits — keep
      # this on (1) while testing, switch to 0 only for the real prod issuance
      # (docs/deploy-vps-ubuntu.md §5, T-04.3-10).
      STAGING: ${STAGING:-1}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_https_secrets:/etc/letsencrypt
      - ./nginx/https.conf.template:/etc/nginx/templates/https.conf.template:ro
      - ./nginx/docker-entrypoint-wrapper.sh:/docker-entrypoint-wrapper.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-wrapper.sh"]
    depends_on:
      miniapp:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  pgdata:
  pgdata_test:
  nginx_https_secrets:
