server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index 200.html;

  # Reverse-proxy to the api container (docker-compose service "api",
  # same yuvibotv2_default network). lib/api.ts/lib/sse.ts build requests
  # against window.location.origin (relative /api/v1/... paths) so the
  # Mini App and the api backend must appear same-origin to the browser —
  # without this the API/SSE calls would 404 against nginx's own static
  # root. FastAPI routes already carry the full "/api/v1/..." path
  # themselves, so proxy_pass has no trailing URI (passes the request URI
  # through unchanged).
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE (GET /api/v1/events): no buffering, long-lived connection.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
  }

  # Hashed build output (/_app/immutable/**) — filename changes on every
  # build, so it's safe to cache indefinitely; nothing ever needs to
  # invalidate it under the same name.
  location /_app/immutable/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # SvelteKit adapter-static SPA fallback (fallback: '200.html', prerender=false
  # on every route via +layout.ts) — every unmatched path serves the client
  # app shell, which then does its own client-side routing. The shell itself
  # (index.html/200.html) MUST NOT be cached: Telegram's in-app WebView has
  # been observed serving a stale shell (pointing at old, since-replaced
  # /_app/immutable/* hashes) after a deploy, so every fix landed here would
  # silently keep failing for players until they happened to fully evict it.
  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri /200.html;
  }
}

