server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index 200.html;

  # Reverse-proxy to the api container (docker-compose service "api",
  # same yuvibotv2_default network). lib/api.ts/lib/sse.ts build requests
  # against window.location.origin (relative /api/v1/... paths) so the
  # Mini App and the api backend must appear same-origin to the browser —
  # without this the API/SSE calls would 404 against nginx's own static
  # root. FastAPI routes already carry the full "/api/v1/..." path
  # themselves, so proxy_pass has no trailing URI (passes the request URI
  # through unchanged).
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE (GET /api/v1/events): no buffering, long-lived connection.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;

    # Compress API JSON. Motivated by POST /api/v1/games/teto_slots, whose
    # `animation` key carries a per-frame spin script: measured over 20 000
    # real spins the envelope is ~17 KB typical, ~135 KB p95, 350 KB max —
    # and it goes to a phone on a mobile link on EVERY auto-spin. That JSON
    # is highly repetitive (the same block_id/symbol_id/row/col keys on every
    # board of every frame), so gzip buys roughly an order of magnitude for
    # a few ms of CPU on a response we already spent a DB transaction on.
    #
    # Scoped deliberately:
    #   - gzip_proxied any — REQUIRED. nginx's default (`off`) means "do not
    #     compress proxied responses at all", so `gzip on` alone would be a
    #     silent no-op behind this proxy_pass.
    #   - gzip_types lists application/json ONLY. text/event-stream is left
    #     out on purpose: the SSE stream above (D-02 balance events) is
    #     long-lived, and running it through the gzip filter risks holding
    #     events in the compressor's buffer. A content type absent from
    #     gzip_types never gets the filter attached at all, so SSE keeps
    #     byte-for-byte its current behaviour.
    # Rejected alternative: Starlette's GZipMiddleware in api/main.py — it is
    # app-wide and would cover that same SSE endpoint, and Starlette has no
    # per-path exclusion.
    gzip on;
    gzip_proxied any;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
  }

  # Hashed build output (/_app/immutable/**) — filename changes on every
  # build, so it's safe to cache indefinitely; nothing ever needs to
  # invalidate it under the same name.
  location /_app/immutable/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # SvelteKit adapter-static SPA fallback (fallback: '200.html', prerender=false
  # on every route via +layout.ts) — every unmatched path serves the client
  # app shell, which then does its own client-side routing. The shell itself
  # (index.html/200.html) MUST NOT be cached: Telegram's in-app WebView has
  # been observed serving a stale shell (pointing at old, since-replaced
  # /_app/immutable/* hashes) after a deploy, so every fix landed here would
  # silently keep failing for players until they happened to fully evict it.
  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri /200.html;
  }
}

