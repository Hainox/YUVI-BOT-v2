[project]
name = "yuvi-bot-v2"
version = "0.1.0"
description = "Telegram bot and Mini App backend for Yuvi Bot v2"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiogram==3.30.0",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.2",
    "structlog==26.1.0",
    "apscheduler==3.11.3",
    "emoji==2.15.0",
    "kurigram==2.2.24",
    "tgcrypto==1.2.5",
    "openai==2.45.0",
    "pgvector==0.5.0",
    "scikit-learn==1.9.0",
    "numpy==2.4.6",
    "redis==5.2.1",
    "pymorphy3==2.0.6",
    "pymorphy3-dicts-ru==2.4.417150.4580142",
    "aiohttp==3.14.3",
]

[project.optional-dependencies]
api = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "httpx==0.28.1",
]
nlp = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "transformers==4.57.6",
    "torch==2.12.1",
    "sentence-transformers==5.7.0",
    "sentencepiece==0.2.2",
    "numpy==2.4.6",
    "pydantic==2.13.4",
    "protobuf==7.35.1",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
